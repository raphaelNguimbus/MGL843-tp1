name: 🥤 TypeScript Analysis with Moose

on:
    push:
        branches: ["main"]
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
permissions:
    contents: read
    actions: read
    pull-requests: write
    issues: write

jobs:
    analyze:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout du dépôt
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present

            - name: Installer ts2famix
              run: npm install -g ts2famix

            - name: Générer le modèle Famix (JSON)
              run: |
                  # -l 4 is log warnings only
                  ts2famix -l 4 -i tsconfig.json -o model.json
                  echo "Modèle généré : $(wc -c < model.json) octets"
                  # Vérification rapide que le JSON est valide
                  python3 -c "import json; json.load(open('model.json')); print('JSON valide')"

            - name: Installer smalltalkCI (image Moose)
              uses: hpi-swa/setup-smalltalkCI@v1
              id: smalltalkci
              with:
                  smalltalk-image: Moose64-12

            - name: Charger FamixTypeScript et exporter les métriques CSV
              run: |
                  # Run the Moose analysis using the Moose configuration
                  smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }} .github/moose-analyse.ston
              shell: bash
              timeout-minutes: 20

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r visualization/requirements.txt

            - name: Generate visualization images
              run: |
                  mkdir -p visualization/out

                  RAW_PREFIX="fig-${{ github.ref_name }}"
                  SAFE_PREFIX="$(echo "$RAW_PREFIX" | sed 's#[^A-Za-z0-9._-]#-#g')"

                  # TP2 charts from current CSV
                  python visualization/visualize_metrics_tp2.py \
                    export_metrics.csv \
                    -o visualization/out \
                    --prefix "$SAFE_PREFIX"

                  echo "Generated images:"
                  ls -1 visualization/out/*.png || true

            - name: Upload visualization artifacts
              uses: actions/upload-artifact@v4
              id: upload_visuals
              with:
                  name: typescript-visualizations
                  path: visualization/out/*.png
                  if-no-files-found: warn

            - name: Upload metrics artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: typescript-metrics
                  path: |
                      export_metrics.md
                      model.json
                      export_metrics.csv
                      
                      - name: Commit generated images (PR only)
                        if: github.event_name == 'pull_request'
                        id: commit_images
                        run: |
                            set -e
                            if ls visualization/out/*.png >/dev/null 2>&1; then
                              git config user.name "github-actions[bot]"
                              git config user.email "github-actions[bot]@users.noreply.github.com"
                              git add visualization/out/*.png
          
                              if ! git diff --cached --quiet; then
                                git commit -m "chore(ci): update generated metric visualizations"
                                git push
                              else
                                echo "No image changes to commit."
                              fi
                            else
                              echo "No png files found."
                            fi
          
                            SHA="$(git rev-parse HEAD)"
                            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                            echo "Using SHA: $SHA"

            - name: Comment each image inline on PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require("fs");
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const prNumber = context.payload.pull_request.number;

                      // Important: use PR head ref (branch) because images were pushed there
                      const branch = context.payload.pull_request.head.ref;
                      const outDir = "visualization/out";

                      if (!fs.existsSync(outDir)) {
                        core.info("No visualization output directory found.");
                        return;
                      }

                      const files = fs.readdirSync(outDir)
                        .filter(f => f.toLowerCase().endsWith(".png"))
                        .sort();

                      for (const file of files) {
                        const path = `visualization/out/${file}`;
                        const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
                        const body = `### 📊 ${file}\n\n![${file}](${rawUrl})`;
                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number: prNumber,
                          body
                        });
                      }