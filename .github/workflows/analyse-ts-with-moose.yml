name: 🥤 TypeScript Analysis with Moose

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  analyze:
    # Skip full analysis on PR close (cleanup job below handles that)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node deps
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Installer ts2famix
        run: npm install -g ts2famix

      - name: Générer le modèle Famix (JSON)
        run: |
          ts2famix -l 4 -i tsconfig.json -o model.json
          echo "Modèle généré : $(wc -c < model.json) octets"
          python3 -c "import json; json.load(open('model.json')); print('JSON valide')"

      - name: Installer smalltalkCI (image Moose)
        uses: hpi-swa/setup-smalltalkCI@v1
        id: smalltalkci
        with:
          smalltalk-image: Moose64-12

      - name: Charger FamixTypeScript et exporter les métriques CSV
        run: |
          smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }} .github/moose-analyse.ston
        shell: bash
        timeout-minutes: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r visualization/requirements.txt

      - name: Generate visualization images
        run: |
          set -euo pipefail
          mkdir -p visualization/out

          RAW_PREFIX="fig-${{ github.ref_name }}-${{ github.run_number }}"
          SAFE_PREFIX="$(echo "$RAW_PREFIX" | sed 's#[^A-Za-z0-9._-]#-#g')"
          echo "Using prefix: $SAFE_PREFIX"

          # TP2 charts from current exported CSV
          python visualization/visualize_metrics.py \
            export_metrics.csv \
            -o visualization/out \
            --prefix "$SAFE_PREFIX" \
            --title "${{ github.ref_name }}"

          echo "Generated images:"
          ls -1 visualization/out/*.png || true

      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-metrics
          path: |
            export_metrics.md
            model.json
            export_metrics.csv

      - name: Upload visualization artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-visualizations
          path: visualization/out/*.png
          if-no-files-found: warn

      - name: Publish images to PR host branch
        if: github.event_name == 'pull_request'
        id: publish_images
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          HOST_BRANCH="ci/pr-${PR_NUMBER}-images"
          VERSION="v${{ github.run_number }}"
          DEST_DIR="${VERSION}"

          # Preserve generated files while switching branches
          rm -rf /tmp/ci-images
          mkdir -p /tmp/ci-images
          cp -R visualization/out/. /tmp/ci-images/ || true

          if ! ls /tmp/ci-images/*.png >/dev/null 2>&1; then
            echo "No generated PNG files found; skipping publish."
            echo "host_branch=${HOST_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin

          if git ls-remote --heads origin "${HOST_BRANCH}" | grep -q "refs/heads/${HOST_BRANCH}$"; then
            git checkout -B "${HOST_BRANCH}" "origin/${HOST_BRANCH}"
          else
            git checkout --orphan "${HOST_BRANCH}"
            git rm -rf . || true
          fi

          mkdir -p "${DEST_DIR}"
          cp -R /tmp/ci-images/. "${DEST_DIR}/"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DEST_DIR}"

          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): PR #${PR_NUMBER} images ${VERSION}"
            git push -u origin "${HOST_BRANCH}"
          else
            echo "No changes to publish on host branch."
          fi

          echo "host_branch=${HOST_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upsert sticky PR comment with images
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          HOST_BRANCH: ${{ steps.publish_images.outputs.host_branch }}
          VERSION: ${{ steps.publish_images.outputs.version }}
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const hostBranch = process.env.HOST_BRANCH;
            const version = process.env.VERSION;

            const marker = "<!-- ci-metrics-images-sticky-comment -->";
            const outDir = "visualization/out";

            if (!fs.existsSync(outDir)) {
              core.info("No visualization/out directory found.");
              return;
            }

            const files = fs.readdirSync(outDir)
              .filter(f => f.toLowerCase().endsWith(".png"))
              .sort();

            if (files.length === 0) {
              core.info("No PNG files found to comment.");
              return;
            }

            const lines = [];
            lines.push(marker);
            lines.push("## 📊 CI Metrics Visualizations");
            lines.push("");
            lines.push(`Version: \`${version}\``);
            lines.push(`Images branch: \`${hostBranch}\``);
            lines.push("");

            for (const file of files) {
              const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${hostBranch}/${version}/${file}`;
              lines.push(`### ${file}`);
              lines.push(`![${file}](${rawUrl})`);
              lines.push("");
            }

            const body = lines.join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(c =>
              c.user?.type === "Bot" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated sticky comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
              core.info(`Created sticky comment ${created.data.id}`);
            }

  cleanup-pr-images-branch:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR image host branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = `ci/pr-${prNumber}-images`;
            const ref = `heads/${branch}`;

            try {
              await github.rest.git.deleteRef({ owner, repo, ref });
              core.info(`Deleted branch: ${branch}`);
            } catch (e) {
              if (e.status === 404 || e.status === 422) {
                core.info(`Branch does not exist or already deleted: ${branch}`);
              } else {
                throw e;
              }
            }
