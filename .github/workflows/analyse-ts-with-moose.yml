name: 🥤 TypeScript Analysis with Moose

on:
    push:
        branches: ["main"]
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

jobs:
    analyze:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout du dépôt
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present

            - name: Installer ts2famix
              run: npm install -g ts2famix

            - name: Générer le modèle Famix (JSON)
              run: |
                  # -l 4 is log warnings only
                  ts2famix -l 4 -i tsconfig.json -o model.json
                  echo "Modèle généré : $(wc -c < model.json) octets"
                  # Vérification rapide que le JSON est valide
                  python3 -c "import json; json.load(open('model.json')); print('JSON valide')"

            - name: Installer smalltalkCI (image Moose)
              uses: hpi-swa/setup-smalltalkCI@v1
              id: smalltalkci
              with:
                  smalltalk-image: Moose64-12

            - name: Charger FamixTypeScript et exporter les métriques CSV
              run: |
                  # Run the Moose analysis using the Moose configuration
                  smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }} .github/moose-analyse.ston
              shell: bash
              timeout-minutes: 20

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r visualization/requirements.txt

            - name: Generate visualization images
              run: |
                  mkdir -p visualization/out

                  # TP2 charts from current CSV
                  python visualization/visualize_metrics_tp2.py \
                    export_metrics.csv \
                    -o visualization/out \
                    --prefix fig-${{ github.ref_name }}

                  echo "Generated images:"
                  ls -1 visualization/out/*.png || true

            - name: Upload visualization artifacts
              uses: actions/upload-artifact@v4
              id: upload_visuals
              with:
                  name: typescript-visualizations
                  path: visualization/out/*.png
                  if-no-files-found: warn

            - name: Upload metrics artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: typescript-metrics
                  path: |
                      export_metrics.md
                      model.json
                      export_metrics.csv

            - name: Comment images on PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              env:
                  ARTIFACT_URL: ${{ steps.upload_visuals.outputs.artifact-url }}
              with:
                  script: |
                      const fs = require("fs");
                      const path = require("path");

                      const prNumber = context.payload.pull_request.number;
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;

                      const outDir = "visualization/out";
                      if (!fs.existsSync(outDir)) {
                        core.info("No visualization output directory found.");
                        return;
                      }

                      const files = fs.readdirSync(outDir)
                        .filter(f => f.toLowerCase().endsWith(".png"))
                        .sort();

                      if (files.length === 0) {
                        core.info("No PNG files found to comment.");
                        return;
                      }

                      for (const file of files) {
                        const body = [
                          `### 📊 ${file}`,
                          "",
                          "Image generated by CI.",
                          "",
                          process.env.ARTIFACT_URL
                            ? `Download artifact (contains this image): ${process.env.ARTIFACT_URL}`
                            : "_Artifact link unavailable in this run._"
                        ].join("\n");

                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number: prNumber,
                          body
                        });
                      }